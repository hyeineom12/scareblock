<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 342" width="380" height="342"
     font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="380" height="342" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#000" stroke-width="1.4"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#000" stroke-width="1.6"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M9,1 L0,5 L9,9" fill="none" stroke="#000" stroke-width="1.6"/>
    </marker>
    <pattern id="h" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.1" opacity=".45"/>
    </pattern>
  </defs>

  <!-- ================= (a) 지연 없음 — (b)와 같은 축척 (75 단위/s) ================= -->
  <text x="8" y="18" font-size="12.5" font-weight="700">(a) 지연 없음 (L = 0)</text>
  <text x="4" y="49" font-size="10">라이브 =</text>
  <text x="4" y="62" font-size="10">사용자 화면</text>

  <line x1="66" y1="52" x2="366" y2="52" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="150" y1="38" x2="150" y2="66" stroke="#000" stroke-width="1.6"/>
  <line x1="151.9" y1="38" x2="151.9" y2="66" stroke="#000" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="150" y="32" font-size="10.5" text-anchor="middle">사건 onset</text>
  <text x="150" y="80" font-size="10" text-anchor="middle">= 사용자 노출</text>

  <path d="M194,34 L158,48" stroke="#000" stroke-width="1.1" marker-end="url(#as)"/>
  <text x="200" y="22" font-size="10.5">탐지 확신 시각 —</text>
  <text x="200" y="35" font-size="10.5" font-weight="700">노출보다 늦다</text>
  <text x="200" y="48" font-size="9.5" fill="#444">개입 준비 구간이 없다 (예산 &lt; 0)</text>

  <!-- 확대 상자: 이 그림에서 축척이 바뀌는 유일한 곳 -->
  <g>
    <line x1="138" y1="86" x2="18" y2="95" stroke="#888" stroke-width=".8"/>
    <line x1="164" y1="86" x2="362" y2="95" stroke="#888" stroke-width=".8"/>
    <rect x="18" y="95" width="344" height="67" fill="none" stroke="#888" stroke-width=".8"/>
    <text x="24" y="110" font-size="9.5" fill="#444">확대 ×80</text>
    <line x1="28" y1="130" x2="356" y2="130" stroke="#000" stroke-width="1"/>
    <line x1="90" y1="122" x2="90" y2="138" stroke="#000" stroke-width="1.4"/>
    <line x1="240" y1="122" x2="240" y2="138" stroke="#000" stroke-width="1.2" stroke-dasharray="3 2"/>
    <path d="M90,130 L240,130" stroke="#000" stroke-width="1" marker-start="url(#ar)" marker-end="url(#as)"/>
    <text x="165" y="119" font-size="9.5" text-anchor="middle">25 ms 분석 창</text>
    <text x="165" y="150" font-size="9.5" text-anchor="middle" fill="#444">(+ 처리 시간은 미측정)</text>
    <text x="246" y="150" font-size="9.5">블러가 사건 뒤에 걸린다</text>
  </g>

  <line x1="0" y1="178" x2="380" y2="178" stroke="#ccc" stroke-width="1"/>

  <!-- ================= (b) 제안 — 75 단위/s ================= -->
  <text x="8" y="200" font-size="12.5" font-weight="700">(b) 제안 — 지연을 의도적으로 도입 (L = 3.0 s)</text>

  <text x="4" y="229" font-size="10">라이브</text>
  <text x="4" y="242" font-size="9.5" fill="#444">(탐지기)</text>
  <line x1="66" y1="232" x2="366" y2="232" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="100" y1="218" x2="100" y2="246" stroke="#000" stroke-width="1.6"/>
  <text x="100" y="212" font-size="10.5" text-anchor="middle">사건 onset</text>
  <rect x="100" y="225" width="1.9" height="14" fill="url(#h)"/>
  <line x1="105" y1="224" x2="101.5" y2="230" stroke="#666" stroke-width=".8"/>
  <text x="107" y="222" font-size="9.5">25 ms</text>

  <!-- 예산 -->
  <rect x="101.9" y="258" width="223.1" height="16" fill="url(#h)"/>
  <path d="M101.9,266 L325,266" stroke="#000" stroke-width="1.1"
        marker-start="url(#ar)" marker-end="url(#as)"/>
  <text x="195" y="254" font-size="11" text-anchor="middle" font-weight="700">개입 준비 예산 ≈ 2.98 s</text>
  <text x="325" y="254" font-size="9.5" text-anchor="middle" fill="#444">블러 준비 완료</text>
  <line x1="100" y1="246" x2="100" y2="300" stroke="#000" stroke-width=".8" stroke-dasharray="2 2"/>
  <line x1="325" y1="246" x2="325" y2="286" stroke="#000" stroke-width=".8" stroke-dasharray="2 2"/>

  <text x="4" y="297" font-size="10">사용자 화면</text>
  <text x="4" y="310" font-size="9.5" fill="#444">(3 s 뒤)</text>
  <line x1="66" y1="300" x2="366" y2="300" stroke="#000" stroke-width="1.2"
        stroke-dasharray="6 3" marker-end="url(#a)"/>
  <line x1="325" y1="286" x2="325" y2="314" stroke="#000" stroke-width="1.6"/>
  <text x="325" y="328" font-size="10.5" text-anchor="middle">사용자 노출</text>
</svg>
