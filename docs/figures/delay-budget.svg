<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" width="560" height="352"
     font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="560" height="352" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#000" stroke-width="1.4"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#000" stroke-width="1.6"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M9,1 L0,5 L9,9" fill="none" stroke="#000" stroke-width="1.6"/>
    </marker>
    <pattern id="h" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.1" opacity=".45"/>
    </pattern>
  </defs>

  <!-- ================= (a) 지연 없음 ================= -->
  <text x="8" y="22" font-size="12.5" font-weight="700">(a) 지연 없음 (L = 0)</text>
  <text x="8" y="64" font-size="11">라이브 =</text>
  <text x="8" y="78" font-size="11">사용자 화면</text>

  <line x1="118" y1="72" x2="540" y2="72" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="214" y1="56" x2="214" y2="88" stroke="#000" stroke-width="1.6"/>
  <text x="214" y="50" font-size="11" text-anchor="middle">사건 onset</text>
  <text x="214" y="104" font-size="10.5" text-anchor="middle">= 사용자 노출</text>

  <rect x="214" y="62" width="20" height="20" fill="url(#h)"/>
  <line x1="234" y1="56" x2="234" y2="88" stroke="#000" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M300,72 L242,72" stroke="#000" stroke-width="1.1" marker-end="url(#as)"/>
  <text x="306" y="69" font-size="11">탐지 확신 시각 — <tspan font-weight="700">노출보다 늦다</tspan></text>
  <text x="306" y="84" font-size="10" fill="#444">개입 준비 구간이 없다 (예산 &lt; 0)</text>

  <!-- 확대 -->
  <g>
    <line x1="214" y1="116" x2="120" y2="140" stroke="#888" stroke-width=".8"/>
    <line x1="234" y1="116" x2="470" y2="140" stroke="#888" stroke-width=".8"/>
    <rect x="120" y="140" width="350" height="40" fill="none" stroke="#888" stroke-width=".8"/>
    <text x="128" y="155" font-size="9.5" fill="#444">확대 ×160</text>
    <line x1="128" y1="170" x2="462" y2="170" stroke="#000" stroke-width="1"/>
    <line x1="150" y1="162" x2="150" y2="178" stroke="#000" stroke-width="1.4"/>
    <line x1="330" y1="162" x2="330" y2="178" stroke="#000" stroke-width="1.2" stroke-dasharray="3 2"/>
    <path d="M150,170 L330,170" stroke="#000" stroke-width="1" marker-start="url(#ar)" marker-end="url(#as)"/>
    <text x="240" y="166" font-size="9.5" text-anchor="middle">25 ms 분석 창 + 처리</text>
    <text x="340" y="174" font-size="9.5">블러가 사건 뒤에 걸린다</text>
  </g>

  <line x1="0" y1="200" x2="560" y2="200" stroke="#ccc" stroke-width="1"/>

  <!-- ================= (b) 제안 ================= -->
  <text x="8" y="224" font-size="12.5" font-weight="700">(b) 제안 — 지연을 의도적으로 도입 (L = 3.0 s)</text>

  <text x="8" y="266" font-size="11">라이브</text>
  <text x="8" y="280" font-size="10" fill="#444">(탐지기)</text>
  <line x1="118" y1="272" x2="540" y2="272" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="166" y1="258" x2="166" y2="286" stroke="#000" stroke-width="1.6"/>
  <text x="166" y="252" font-size="11" text-anchor="middle">사건 onset</text>
  <rect x="166" y="263" width="4" height="18" fill="url(#h)"/>
  <text x="178" y="268" font-size="9.5">25 ms</text>

  <text x="8" y="326" font-size="11">사용자 화면</text>
  <text x="8" y="340" font-size="10" fill="#444">(3 s 뒤)</text>
  <line x1="118" y1="332" x2="540" y2="332" stroke="#000" stroke-width="1.2"
        stroke-dasharray="6 3" marker-end="url(#a)"/>
  <line x1="406" y1="318" x2="406" y2="346" stroke="#000" stroke-width="1.6"/>
  <text x="406" y="314" font-size="11" text-anchor="middle">사용자 노출</text>

  <!-- 예산 -->
  <rect x="170" y="292" width="236" height="16" fill="url(#h)"/>
  <path d="M170,300 L406,300" stroke="#000" stroke-width="1.1"
        marker-start="url(#ar)" marker-end="url(#as)"/>
  <text x="288" y="289" font-size="11" text-anchor="middle" font-weight="700">개입 준비 예산 ≈ 2.98 s</text>
  <line x1="166" y1="286" x2="166" y2="332" stroke="#000" stroke-width=".8" stroke-dasharray="2 2"/>
  <line x1="406" y1="286" x2="406" y2="318" stroke="#000" stroke-width=".8" stroke-dasharray="2 2"/>
  <text x="414" y="303" font-size="10" fill="#444">블러 준비 완료</text>
</svg>
